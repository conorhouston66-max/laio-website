<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #FBFAF7; overflow: hidden; position: relative; font-family: 'Inter', sans-serif; }
  .grain {
    position: absolute; inset: 0; opacity: 0.4;
    background-image: radial-gradient(#0C3D28 0.6px, transparent 0.6px);
    background-size: 14px 14px;
  }
  .glow { position: absolute; top: -220px; right: -160px; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(23,132,90,0.14), transparent 68%); }
  html, body { width: 1200px; height: 630px; }
  .canvas { position: absolute; top: 0; left: 0; width: 1200px; height: 630px; padding: 76px; }
  .brand { position: absolute; top: 76px; left: 76px; display: flex; align-items: center; gap: 14px; }
  .brand img { width: 52px; height: 52px; }
  .brand span { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; color: #0C3D28; }
  .brand span em { font-style: normal; color: #17845A; }
  .mid { position: absolute; top: 200px; left: 76px; max-width: 880px; }
  .eyebrow { display: inline-block; font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #0F6B47; background: #E4F2EA; padding: 8px 18px; border-radius: 999px; margin-bottom: 28px; }
  h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 68px; line-height: 1.08; letter-spacing: -0.03em; color: #10231A; margin-bottom: 22px; }
  h1 .hl { color: #17845A; position: relative; }
  h1 .hl .mark { position: absolute; left: -2%; right: -3%; bottom: 6px; height: 0.4em; background: rgba(83,196,141,0.35); z-index: -1; border-radius: 3px; }
  p.sub { font-size: 24px; color: #46564D; font-weight: 500; }
  .foot { position: absolute; top: 522px; left: 76px; display: flex; align-items: center; gap: 24px; }
  .pricepill { display: flex; align-items: center; gap: 14px; background: #0C3D28; border-radius: 14px; padding: 14px 26px; }
  .pricepill .old { color: rgba(255,255,255,0.5); font-weight: 700; font-size: 20px; text-decoration: line-through; }
  .pricepill .arrow { color: #7ED9A9; font-size: 20px; }
  .pricepill .new { color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 26px; }
  .url { font-size: 20px; font-weight: 600; color: #7C8A81; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="grain"></div>
  <div class="canvas">
    <div class="brand">
      <img src="fo-mark.svg" alt="">
      <span>Free<em>Outbound</em></span>
    </div>
    <div class="mid">
      <span class="eyebrow">Zero cost to start, zero risk to try</span>
      <h1>Your first outbound campaign is <span class="hl"><span class="mark"></span>on us</span>.</h1>
      <p class="sub">We build the list, write the emails, and run the sends. You take the meetings.</p>
    </div>
    <div class="foot">
      <div class="pricepill"><span class="old">$5,000</span><span class="arrow">→</span><span class="new">$0</span></div>
      <span class="url">freeoutbound.com</span>
    </div>
  </div>
</body></html>
